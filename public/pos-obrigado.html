<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Confirmação de entrega do Kit Segundo Cérebro.">
<meta name="color-scheme" content="dark">
<title>Seu material chegou no seu e-mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Onest:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root{
    --onyx:#020202;
    --carbon:#171717;
    --line:rgba(240,240,228,.16);
    --warm:#F0F0E4;
    --muted:#A9A99D;
    --lime:#C6FF34;
    --teal:#3BD0A0;
    --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --body:"Onest","Inter",system-ui,sans-serif;
    --mono:"Geist Mono","SFMono-Regular",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    min-height:100svh;
    margin:0;
    display:grid;
    place-items:center;
    padding:24px;
    color:var(--warm);
    background:
      radial-gradient(70% 55% at 50% 0%,rgba(198,255,52,.1),transparent 70%),
      var(--onyx);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  main{
    width:min(100%,620px);
    padding:clamp(32px,7vw,58px);
    text-align:center;
    border:1px solid var(--line);
    border-radius:24px;
    background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    box-shadow:0 30px 90px rgba(0,0,0,.45);
  }
  .mark{
    width:64px;
    height:64px;
    margin:0 auto 26px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:#071006;
    background:linear-gradient(135deg,var(--lime),var(--teal));
    font:800 30px/1 var(--display);
    box-shadow:0 0 40px rgba(198,255,52,.22);
  }
  .eyebrow{
    margin:0 0 14px;
    color:var(--lime);
    font:500 11px/1.4 var(--mono);
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  h1{
    margin:0;
    font:800 clamp(30px,7vw,48px)/1.04 var(--display);
    letter-spacing:-.04em;
  }
  p{
    max-width:470px;
    margin:22px auto 0;
    color:var(--muted);
    font-size:clamp(16px,3vw,18px);
    line-height:1.65;
  }
  strong{color:var(--warm)}
  footer{
    margin-top:30px;
    color:#6F6F66;
    font:500 11px/1.4 var(--mono);
    letter-spacing:.1em;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✓</div>
  <p class="eyebrow">Pedido concluído</p>
  <h1>Obrigado.</h1>
  <p><strong>Seu material chegou no seu e-mail.</strong> Se não aparecer em alguns minutos, confira também a caixa de spam e a aba de promoções.</p>
  <footer>Infuser &middot; {cérebro}</footer>
</main>
</body>
</html>
